<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Pallet</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Boldonse&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"><img src="images/" alt="">Pallet</a>
            <ul class="nav-menu">
                <li><a href="index.html">Work</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>


    <div class="hero">
        <div><h2>Contact</h2></div>
        <div><h2>Me</h2></div>
        
    </div>

    <div class="parent">
        <div class="Image">
            <img src="images/pallete logo - Copy.png" alt="">
        </div>

        <div class="contact">

            <form action="" class="fill-up-form" method="POST">

                <div class="fname form">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="first-name" placeholder="Enter first name" required>
                </div>

                <div class="fname form">
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Enter last name" required>
                </div>

                <div class="fname form">
                    <label for="phone">Phone</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                </div>

                <div class="fname form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter email address" required>
                </div>

                <button type="submit">Submit</button>
            </form>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h5>Palette</h5>
                    <p>Mick Adan — Designer & Developer</p>
                </div>
                <div class="footer-section">
                    <h5>Quick Links</h5>
                    <ul>
                        <li><a href="index.html">Work</a></li>
                        <li><a href="service.html">About</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h5>Connect</h5>
                    <ul>
                        <li><a href="#">Twitter</a></li>
                        <li><a href="#">LinkedIn</a></li>
                        <li><a href="#">GitHub</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>2024 Allie. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>

</html>
